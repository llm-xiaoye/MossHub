[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "raghub"
version = "0.1.0"
description = "Local, source-traceable RAG prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "celery[redis]>=5.5,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "pymilvus>=2.6.17,<3",
  "redis>=5,<7",
  "uvicorn[standard]>=0.34,<1",
  "psutil>=6,<8",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.20,<2",
]

[project.optional-dependencies]
models = [
  "FlagEmbedding>=1.3,<2",
  "torch>=2.6,<3",
  "huggingface-hub>=0.30,<2",
]
ingestion = [
  "crawl4ai>=0.7,<1",
  "markdown-it-py>=4.2,<5",
  "docling==2.131.0",
  "openpyxl==3.1.5",
  "rapidocr==3.9.2",
  "onnxruntime==1.30.0",
  "mdit-py-plugins>=0.4,<1",
  "rapidfuzz>=3,<4",
]
evaluation = [
  "openai>=1.90,<3",
  "ragas>=0.4,<1",
  # Ragas 0.4.3 still imports a module removed in community 0.4.2.
  "langchain-community==0.4.1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/raghub"]

[tool.uv]
package = true
